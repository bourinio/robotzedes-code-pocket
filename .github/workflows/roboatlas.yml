name: RoboAtlas

on:
  push:
    branches: [ "main", "ccr-*" ]
    paths: [ "roboatlas/**", ".github/workflows/roboatlas.yml" ]
  pull_request:
    paths: [ "roboatlas/**", ".github/workflows/roboatlas.yml" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine tests
        run: node --test roboatlas/tests/engine.test.js

  apk:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roboatlas/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RoboAtlas-APK
          path: roboatlas/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
