name: Build Prosvasimi Arta APK

on:
  push:
    branches: [ "main", "ccr-*" ]
    paths: [ "arta-access-map/**", ".github/workflows/build-arta-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arta-access-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web app (local version)
        run: |
          npm ci
          npm test
          npm run build:local

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: arta-access-map/android
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Prosvasimi-Arta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prosvasimi-Arta-APK
          path: arta-access-map/Prosvasimi-Arta.apk
          if-no-files-found: error
