<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<title>ROBOTZEDES – Robotics Code Pocket</title>
<style>
:root{
  --blue:#0b67b2;
  --blue2:#0875c7;
  --pink:#f00087;
  --pink2:#ff0080;
  --text:#152038;
  --muted:#8b8f98;
  --bg:#ffffff;
  --soft:#f7f8fb;
  --line:#eceff4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
.app{
  width:min(100%,760px);
  margin:0 auto;
  padding:22px 18px 118px;
  background:
    radial-gradient(circle at 50% -20%, #ffffff 0 38%, #fbfbfd 70%, #fff 100%);
}
.topbar{
  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:10px;
  margin:12px 0 26px;
}
.iconbtn{
  border:0;background:transparent;padding:0;width:48px;height:48px;
  display:grid;place-items:center;cursor:pointer;
}
.menu-lines{width:32px}
.menu-lines span{display:block;height:4px;border-radius:4px;background:var(--pink);margin:5px 0}
.heart{
  width:48px;height:48px;border-radius:50%;background:var(--pink);
  color:#fff;font-size:28px;line-height:48px;text-align:center;font-weight:300;
}
.brand{display:flex;align-items:center;justify-content:center;gap:9px}
.logo{width:82px;height:82px;flex:none}
.wordmark{line-height:.96}
.wordline{
  font-size:clamp(25px,6vw,41px);
  font-weight:1000;
  letter-spacing:-1.8px;
  white-space:nowrap;
  font-family:Impact,"Arial Black",Arial,sans-serif;
}
.wordline .rb{color:var(--blue)}
.wordline .rz{color:var(--pink)}
.subtitle{font-size:clamp(13px,3vw,20px);font-weight:800;color:#1b5c9f;margin-top:7px}
.edition{font-size:clamp(12px,2.8vw,18px);color:var(--pink);margin-top:7px}
.searchbox{
  height:78px;border:1.8px solid var(--blue);border-radius:22px;background:#fff;
  display:grid;grid-template-columns:58px 1fr 58px;align-items:center;
  box-shadow:0 6px 20px rgba(22,55,92,.10);
  margin-bottom:26px;
}
.searchicon{font-size:36px;color:var(--pink);text-align:center;line-height:1;transform:rotate(-10deg)}
.searchbox input{
  border:0;outline:0;background:transparent;font-size:clamp(16px,3.6vw,24px);
  color:#40454f;width:100%;
}
.searchbox input::placeholder{color:#92959d}
.filter{font-size:31px;color:var(--pink);text-align:center;font-weight:700}
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.platform{
  min-height:280px;background:#fff;border-radius:23px;overflow:hidden;
  box-shadow:0 8px 24px rgba(18,41,72,.13);display:flex;flex-direction:column;cursor:pointer;
}
.p-top{height:96px;position:relative}
.p-corner{
  width:118px;height:96px;border-bottom-right-radius:46px;
  display:grid;place-items:center;color:#fff;
}
.blue .p-corner,.blue .p-bottom{background:linear-gradient(135deg,#075eaa,#0878c9)}
.pink .p-corner,.pink .p-bottom{background:linear-gradient(135deg,#f00087,#f60074)}
.picon{width:58px;height:58px}
.p-body{padding:22px 20px 16px;flex:1}
.p-name{
  font-family:Impact,"Arial Black",Arial,sans-serif;
  letter-spacing:.4px;font-size:clamp(21px,4vw,31px);margin-bottom:12px;
}
.blue .p-name{color:var(--blue)} .pink .p-name{color:var(--pink)}
.p-desc{font-size:clamp(14px,2.7vw,19px);line-height:1.35;color:#555b65}
.p-bottom{
  height:54px;display:flex;align-items:center;justify-content:space-between;
  color:white;padding:0 20px;font-weight:900;font-size:14px;
}
.arrow{font-size:34px;font-weight:300;line-height:1}
.recent-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:34px 0 16px;
}
.recent-left{display:flex;align-items:center;gap:12px;color:var(--blue)}
.clock{
  width:38px;height:38px;border:3px solid var(--pink);border-radius:50%;
  position:relative;flex:none;
}
.clock:before{content:"";position:absolute;width:3px;height:11px;background:var(--pink);left:16px;top:6px;border-radius:2px}
.clock:after{content:"";position:absolute;width:10px;height:3px;background:var(--pink);left:16px;top:16px;transform:rotate(35deg);transform-origin:left center;border-radius:2px}
.recent-title{font-weight:1000;font-size:22px}
.viewall{color:var(--pink);font-weight:900;font-size:14px}
.recent-list{display:grid;gap:12px}
.recent-item{
  min-height:83px;background:#fff;border-radius:16px;border:1px solid var(--line);
  box-shadow:0 5px 16px rgba(26,44,72,.11);display:grid;
  grid-template-columns:56px 1fr 42px;align-items:center;gap:12px;padding:10px 14px;
}
.ricon{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;overflow:hidden}
.rtxt h3{margin:0 0 5px;font-size:17px}
.rmeta{font-size:14px;color:var(--muted)}
.rmeta .plat{font-weight:800}
.rmeta .blueText{color:var(--blue)} .rmeta .pinkText{color:var(--pink)}
.star{font-size:34px;color:var(--pink);font-weight:300;text-align:center}
.bottomnav{
  position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);
  width:min(760px,calc(100% - 20px));height:94px;background:rgba(255,255,255,.98);
  border:1px solid var(--line);border-radius:25px;box-shadow:0 8px 25px rgba(20,39,66,.15);
  display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 5px;
}
.navbtn{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800;cursor:pointer}
.navbtn .ico{font-size:30px;display:block;line-height:1.15;margin-bottom:4px}
.navbtn.active{color:var(--pink);position:relative}
.navbtn.active:before{
  content:"";position:absolute;top:-9px;left:12%;right:12%;height:4px;border-radius:4px;background:var(--pink)
}
.back{font-size:14px;color:var(--blue);font-weight:900;margin:4px 2px 12px;cursor:pointer}
.page-title{font-size:25px;font-weight:1000;color:var(--blue);margin:8px 0 17px}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.category{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:0 5px 16px rgba(25,44,71,.08);cursor:pointer
}
.category .ci{font-size:27px;margin-bottom:9px}.category .cn{font-size:15px;font-weight:900}.category .cc{font-size:12px;color:var(--muted);margin-top:5px}
.cards{display:grid;gap:12px}
.codecard{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;
  box-shadow:0 5px 16px rgba(25,44,71,.08)
}
.codehead{display:flex;align-items:center;gap:11px}
.codeicon{width:46px;height:46px;border-radius:12px;background:#f2f6fb;display:grid;place-items:center;font-size:23px}
.codecard h3{margin:0 0 4px;font-size:16px}.smallmeta{font-size:12px;color:var(--muted)}
.codeactions{display:flex;gap:8px;margin-top:12px}
.codeactions button{border:0;border-radius:11px;padding:10px 12px;font-weight:900}
.show{background:var(--blue);color:#fff;flex:1}.copy{background:#fff0f8;color:var(--pink)}.fav{width:43px;background:#fff5fa;color:var(--pink)}
.codebox{display:none;background:#111827;border-radius:13px;padding:12px;margin-top:12px;overflow:auto}.codebox.on{display:block}
pre{margin:0;color:#eef4ff;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.info{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.55;color:#5b6370}
@media(max-width:520px){
  .app{padding-left:13px;padding-right:13px}
  .topbar{grid-template-columns:38px 1fr 38px;gap:4px}
  .iconbtn,.heart{width:38px;height:38px}.heart{line-height:38px;font-size:23px}
  .menu-lines{width:26px}.logo{width:64px;height:64px}
  .platform-grid{gap:12px}.platform{min-height:245px}.p-corner{width:92px;height:82px}.p-top{height:82px}.picon{width:48px;height:48px}
  .p-body{padding:16px 14px 12px}.p-bottom{padding:0 14px;font-size:12px}
  .recent-item{grid-template-columns:48px 1fr 36px;padding:9px 10px}.ricon{width:44px;height:44px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="iconbtn" onclick="showMenu()" aria-label="Μενού">
      <div class="menu-lines"><span></span><span></span><span></span></div>
    </button>

    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-label="Robotzedes logo">
        <path fill="#0b67b2" d="M18 28h55l15 16v25L71 86H46V51H16z"/>
        <path fill="#f00087" d="M16 58h23v28L16 70z"/>
        <circle fill="#f00087" cx="40" cy="48" r="7"/>
        <circle fill="#f00087" cx="63" cy="48" r="7"/>

      </div>
    </div>

  <div class="searchbox">
    <div class="searchicon">⌕</div>
    <input id="q" placeholder="Αναζήτηση κώδικα, αισθητήρα, ενέργειας..."/>
    <div class="filter">☷</div>
  </div>

  <main id="main"></main>
</div>

<nav class="bottomnav">
  <button class="navbtn active" data-nav="home" onclick="home()"><span class="ico">⌂</span>Αρχική</button>
  <button class="navbtn" data-nav="cat" onclick="allCategories()"><span class="ico">▦</span>Κατηγορίες</button>
  <button class="navbtn" data-nav="fav" onclick="showFavorites()"><span class="ico">🔖</span>Αγαπημένα</button>
  <button class="navbtn" data-nav="dl" onclick="downloads()"><span class="ico">⇩</span>Λήψεις</button>
  <button class="navbtn" data-nav="info" onclick="showInfo()"><span class="ico">ⓘ</span>Πληροφορίες</button>
</nav>

let state={page:"home",platform:null,category:null};

function platformIcon(p){
 if(p==="Arduino") return `<svg class="picon" viewBox="0 0 100 70"><path fill="none" stroke="white" stroke-width="8" d="M48 35C37 15 13 13 8 30c-5 18 17 30 31 14l18-20c13-15 35-9 35 10 0 18-23 26-35 11L45 31"/><path stroke="white" stroke-width="6" d="M18 35h18M27 26v18M70 35h17"/></svg>`;
 if(p==="micro:bit") return `<svg class="picon" viewBox="0 0 100 70"><rect x="8" y="11" width="84" height="48" rx="17" fill="none" stroke="white" stroke-width="6"/><circle cx="27" cy="35" r="5" fill="white"/><circle cx="73" cy="35" r="5" fill="white"/></svg>`;
 if(p==="SPIKE Prime") return `<svg class="picon" viewBox="0 0 100 70"><path fill="white" d="M26 24l24-12 24 12-24 12zM26 24v28l24 13V36zM74 24v28L50 65V36z"/><circle cx="38" cy="22" r="4" fill="#f00087"/><circle cx="50" cy="16" r="4" fill="#f00087"/><circle cx="62" cy="22" r="4" fill="#f00087"/></svg>`;
 return `<svg class="picon" viewBox="0 0 100 70"><rect x="28" y="12" width="44" height="46" rx="4" fill="none" stroke="white" stroke-width="5"/><path stroke="white" stroke-width="4" d="M39 34q11-12 22 0M43 40q7-7 14 0M49 46h2"/><path stroke="white" stroke-width="4" d="M18 18h10M18 28h10M18 38h10M18 48h10M72 18h10M72 28h10M72 38h10M72 48h10"/></svg>`;
}
function setNav(n){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.nav===n))}
function getFav(){return new Set(JSON.parse(localStorage.getItem("robotzedes_fav")||"[]"))}
function saveFav(s){localStorage.setItem("robotzedes_fav",JSON.stringify([...s]))}

function home(){
 state={page:"home",platform:null,category:null};Q.value="";setNav("home");
 const cards=platformOrder.map((p,i)=>{
   const cls=i%2===0?"blue":"pink";
   const d=p==="Arduino"?"Κώδικες & Projects<br>για Arduino":
           p==="micro:bit"?"Κώδικες & Projects<br>για micro:bit":
           p==="SPIKE Prime"?"Κώδικες & Projects<br>για LEGO® SPIKE Prime":
           "Κώδικες & Projects<br>για ESP32";
   return `<section class="platform ${cls}" onclick="openPlatform('${p}')">
    <div class="p-top"><div class="p-corner">${platformIcon(p)}</div></div>
    <div class="p-body"><div class="p-name">${p.toUpperCase()}</div><div class="p-desc">${d}</div></div>
    <div class="p-bottom"><span>ΔΕΣ ΚΩΔΙΚΕΣ</span><span class="arrow">›</span></div>
   </section>`;
 }).join("");
 const recent=SNIPPETS.slice(0,3).map((x,i)=>{
   const pink=x.platform!=="Arduino";
   return `<div class="recent-item" onclick="openSingle(${i})">
      <div class="ricon" style="background:${pink?'#f00087':'#0876b9'}">${platformIcon(x.platform)}</div>
      <div class="rtxt"><h3>${x.title}</h3><div class="rmeta"><span class="plat ${pink?'pinkText':'blueText'}">${x.platform}</span> &nbsp;•&nbsp; ${x.category}</div></div>
      <div class="star">☆</div>
   </div>`;
 }).join("");
 MAIN.innerHTML=`<div class="platform-grid">${cards}</div>
 <div class="recent-head"><div class="recent-left"><div class="clock"></div><div class="recent-title">ΠΡΟΣΦΑΤΑ</div></div><div class="viewall" onclick="showAllCodes()">ΠΡΟΒΟΛΗ ΟΛΩΝ ›</div></div>
 <div class="recent-list">${recent}</div>`;
}
function openSingle(i){renderCards([SNIPPETS[i]],`<div class="back" onclick="home()">← Αρχική</div><div class="page-title">Κώδικας</div>`)}
function openPlatform(p){
 state={page:"platform",platform:p,category:null};Q.value="";setNav("cat");
 const cats=[...new Set(SNIPPETS.filter(x=>x.platform===p).map(x=>x.category))];
 MAIN.innerHTML=`<div class="back" onclick="home()">← Πλατφόρμες</div><div class="page-title">${p}</div><div class="category-grid">${
 cats.map(c=>`<div class="category" onclick="openCategory('${c.replaceAll("'","\\'")}')"><div class="ci">${catIcon[c]||"📁"}</div><div class="cn">${c}</div><div class="cc">${SNIPPETS.filter(x=>x.platform===p&&x.category===c).length} κώδικες</div></div>`).join("")
 }</div>`;
}
function openCategory(c){
 state.category=c;
 renderCards(SNIPPETS.filter(x=>x.platform===state.platform&&x.category===c),
 `<div class="back" onclick="openPlatform('${state.platform}')">← Κατηγορίες</div><div class="page-title">${catIcon[c]||"📁"} ${c}</div>`);
}
function renderCards(items,head=""){
 const fav=getFav();
 MAIN.innerHTML=head+`<div class="cards">${items.length?items.map(x=>{
   const k=favKey(x);
   return `<article class="codecard"><div class="codehead"><div class="codeicon">${x.icon||"💻"}</div><div><h3>${x.title}</h3><div class="smallmeta">${x.platform} • ${x.category}${x.hardware? " • "+x.hardware:""}</div></div></div>
   <div class="codeactions"><button class="show" onclick="toggleCode(this)">Δείξε κώδικα</button><button class="copy" onclick="copyCode(this)">Αντιγραφή</button><button class="fav" data-key="${esc(k)}" onclick="toggleFav(this)">${fav.has(k)?"★":"☆"}</button></div>
   <div class="codebox"><pre>${esc(x.code)}</pre></div></article>`;
 }).join(""):`<div class="info">Δεν βρέθηκαν κώδικες.</div>`}</div>`;
}
function toggleCode(b){const box=b.closest(".codecard").querySelector(".codebox");box.classList.toggle("on");b.textContent=box.classList.contains("on")?"Κρύψε κώδικα":"Δείξε κώδικα"}
function copyCode(b){const t=b.closest(".codecard").querySelector("pre").innerText;const done=()=>{const old=b.textContent;b.textContent="Αντιγράφηκε ✓";setTimeout(()=>b.textContent=old,1000)};if(window.Android&&Android.copyText){Android.copyText(t);done();return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done);return}const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done()}
function toggleFav(b){const s=getFav(),k=b.dataset.key;if(s.has(k))s.delete(k);else s.add(k);saveFav(s);b.textContent=s.has(k)?"★":"☆"}
function showFavorites(){setNav("fav");Q.value="";const s=getFav();renderCards(SNIPPETS.filter(x=>s.has(favKey(x))),`<div class="page-title">Αγαπημένα</div>`)}
function allCategories(){setNav("cat");Q.value="";const cats=[...new Set(SNIPPETS.map(x=>x.category))].sort();MAIN.innerHTML=`<div class="page-title">Κατηγορίες</div><div class="category-grid">${cats.map(c=>`<div class="category" onclick="globalCategory('${c.replaceAll("'","\\'")}')"><div class="ci">${catIcon[c]||"📁"}</div><div class="cn">${c}</div><div class="cc">${SNIPPETS.filter(x=>x.category===c).length} κώδικες</div></div>`).join("")}</div>`}
function globalCategory(c){renderCards(SNIPPETS.filter(x=>x.category===c),`<div class="back" onclick="allCategories()">← Κατηγορίες</div><div class="page-title">${catIcon[c]||"📁"} ${c}</div>`)}
function showAllCodes(){renderCards(SNIPPETS,`<div class="back" onclick="home()">← Αρχική</div><div class="page-title">Όλοι οι κώδικες</div>`)}
function downloads(){setNav("dl");MAIN.innerHTML=`<div class="page-title">Λήψεις</div><div class="info">Οι κώδικες λειτουργούν offline μέσα στην εφαρμογή. Από κάθε κάρτα μπορείς να ανοίξεις και να αντιγράψεις τον κώδικα.</div>`}
function showInfo(){setNav("info");MAIN.innerHTML=`<div class="page-title">Πληροφορίες</div><div class="info"><b>ROBOTZEDES – Robotics Code Pocket</b><br><br>Complete Library Edition με ${SNIPPETS.length} παραδείγματα για Arduino, micro:bit, LEGO® SPIKE Prime και ESP32.</div>`}
function showMenu(){allCategories()}
Q.addEventListener("input",()=>{
 const s=Q.value.trim().toLowerCase();
 if(!s){home();return}
 setNav("");
 renderCards(SNIPPETS.filter(x=>[x.title,x.platform,x.category,x.hardware,x.code].join(" ").toLowerCase().includes(s)),`<div class="page-title">Αποτελέσματα αναζήτησης</div>`)
});
home();
</script>
</body>
</html>
